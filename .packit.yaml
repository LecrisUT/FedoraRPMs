_:
  - &trigger
    trigger: commit
    branch: cuda
  - &actions-use-spec
    fix-spec-file: []
    create-archive:
      - sh -c 'echo ${PACKIT_DOWNSTREAM_PACKAGE_NAME}.spec'
    get-current-version:
      - sh -c 'rpmspec -q --qf "%{Version}" --srpm ${PACKIT_DOWNSTREAM_PACKAGE_NAME}.spec'
  - &actions-rust2rpm
    <<: *actions-use-spec
    fix-spec-file:
      - sh -c 'rust2rpm @${PACKIT_PROJECT_VERSION}'
  - &actions-rust2rpm-with-patch
    <<: *actions-use-spec
    fix-spec-file:
      - sh -c 'rust2rpm -r @${PACKIT_PROJECT_VERSION}'

packages:
  cuda-pathfinder:
    paths: [ cuda-pathfinder ]
    specfile_path: cuda-pathfinder.spec
    downstream_package_name: cuda-pathfinder
    upstream_package_name: cuda-pathfinder
    actions: *actions-use-spec

targets:
  - fedora-44

jobs:
  - job: copr_build
    owner: lecris
    project: cuda-example
    additional_repos:
      - https://developer.download.nvidia.com/compute/cuda/repos/$distname$releasever/$basearch/
    <<: *trigger
#  - job: tests
#    <<: *trigger

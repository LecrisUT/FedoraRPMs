_:
  - &trigger
    trigger: commit
    branch: scikit-build-helpers
  - &actions-use-spec
    fix-spec-file: []
    create-archive:
      - sh -c 'echo ${PACKIT_DOWNSTREAM_PACKAGE_NAME}.spec'
    get-current-version:
      - sh -c 'rpmspec -q --qf "%{Version}" --srpm ${PACKIT_DOWNSTREAM_PACKAGE_NAME}.spec'
  - &actions-rust2rpm
    <<: *actions-use-spec
    fix-spec-file:
      - sh -c 'rust2rpm @${PACKIT_PROJECT_VERSION}'
  - &actions-rust2rpm-with-patch
    <<: *actions-use-spec
    fix-spec-file:
      - sh -c 'rust2rpm -r @${PACKIT_PROJECT_VERSION}'

packages:
  f2py-cmake:
    paths: [ f2py-cmake ]
    specfile_path: f2py-cmake.spec
    downstream_package_name: f2py-cmake
    upstream_package_name: f2py-cmake
    actions: *actions-use-spec
  cython-cmake:
    paths: [ cython-cmake ]
    specfile_path: cython-cmake.spec
    downstream_package_name: cython-cmake
    upstream_package_name: cython-cmake
    actions: *actions-use-spec

jobs:
  - job: copr_build
    owner: lecris
    project: scikit-build-helpers
    <<: *trigger

_:
  - &trigger
    trigger: commit
    branch: wannier90
  - &actions-use-spec
    fix-spec-file: []
    create-archive:
      - sh -c 'echo ${PACKIT_DOWNSTREAM_PACKAGE_NAME}.spec'
    get-current-version:
      - sh -c 'rpmspec -q --qf "%{Version}" --srpm ${PACKIT_DOWNSTREAM_PACKAGE_NAME}.spec'
  - &actions-rust2rpm
    <<: *actions-use-spec
    fix-spec-file:
      - sh -c 'rust2rpm @${PACKIT_PROJECT_VERSION}'
  - &actions-rust2rpm-with-patch
    <<: *actions-use-spec
    fix-spec-file:
      - sh -c 'rust2rpm -r @${PACKIT_PROJECT_VERSION}'

packages:
  wannier90:
    paths: [ wannier90 ]
    specfile_path: wannier90.spec
    downstream_package_name: wannier90
    upstream_package_name: wannier90
    actions: *actions-use-spec

jobs:
  - job: copr_build
    owner: lecris
    project: wannier90
    <<: *trigger

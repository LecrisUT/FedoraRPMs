_:
  - &trigger
    trigger: commit
    branch: mctc-lib
  - &actions-use-spec
    fix-spec-file: []
    create-archive:
      - sh -c 'echo ${PACKIT_DOWNSTREAM_PACKAGE_NAME}.spec'
    get-current-version:
      - sh -c 'rpmspec -q --qf "%{Version}" --srpm ${PACKIT_DOWNSTREAM_PACKAGE_NAME}.spec'
  - &actions-rust2rpm
    <<: *actions-use-spec
    fix-spec-file:
      - sh -c 'rust2rpm @${PACKIT_PROJECT_VERSION}'
  - &actions-rust2rpm-with-patch
    <<: *actions-use-spec
    fix-spec-file:
      - sh -c 'rust2rpm -r @${PACKIT_PROJECT_VERSION}'

packages:
  mctc-lib:
    paths: [ mctc-lib ]
    specfile_path: mctc-lib.spec
    downstream_package_name: mctc-lib
    upstream_package_name: mctc-lib
    actions: *actions-use-spec

targets:
  - fedora-rawhide

jobs:
  - job: copr_build
    owner: lecris
    project: mctc-lib
    <<: *trigger
#  - job: tests
#    <<: *trigger
